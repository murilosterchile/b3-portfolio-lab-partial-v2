[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "b3-portfolio-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "b3-portfolio-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0.38",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.8",
  "argon2-cffi>=23.1",
  "httpx>=0.28",
  "email-validator>=2.2",
  "redis>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.uv.sources]
b3-portfolio-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

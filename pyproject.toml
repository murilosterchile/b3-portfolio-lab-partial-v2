[project]
name = "b3-portfolio-lab-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["packages/portfolio_core", "services/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

name: ci
on:
  push:
  pull_request:

jobs:
  python-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ./packages/portfolio_core pytest ruff pip-audit
      - run: ruff check packages services scripts
      - run: pytest -q packages/portfolio_core/tests
      - run: pip-audit
      - run: cmake -S native/qkp -B native/qkp/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build native/qkp/build -j2
      - run: ctest --test-dir native/qkp/build --output-on-failure
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
